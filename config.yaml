# relative path to the raw data file
raw_data_file: "raw-data/GBF_110626.csv"

# set to true to run the pipeline on Qualtrics test/preview responses,
# with JS attribute columns filled in by sampling from preview responses.
# set to false to run on real survey responses.
use_test_data: false

# Random seed for reproducibility of stochastic algorithms (e.g. mclust EM).
random_seed: 2024

# -------------------
# Respondent groupings
# -------------------
country_recode:
  "1": "Australia"
  "2": "Brazil"
  "3": "Germany"
  "4": "Kenya"
  "5": "Vietnam"
  "6": "UAE"

country_levels:
  - "Australia"
  - "Brazil"
  - "Germany"
  - "Kenya"
  - "UAE"
  - "Vietnam"

flyer_recode:
  "Non- Flyer":       "Never-flyer"
  "Infrequent Flyer": "Infrequent/lapsed flyer"
  "Occasional Flyer": "Occasional flyer"
  "Frequent Flyer":   "Frequent flyer"

flyer_levels:
  - "Never-flyer"
  - "Infrequent/lapsed flyer"
  - "Occasional flyer"
  - "Frequent flyer"

concern_levels:
  - "Low"
  - "Mid"
  - "High"

policy_levels:
  - "GBF"
  - "CORSIA"
  - "SAF_ETS"
  - "VCM_SBTi"
  - "VCM_status_quo"

# Display names for the policy packages, used in every figure. `long` for
# axis/legend labels with room; `short` (the tag) for tight panels and text.
policy_labels:
  SAF_ETS:        {long: "Clean fuel transition (SAF mandate + carbon storage)", short: "SAF mandate + carbon storage"}
  GBF:            {long: "Supplier-mandated carbon storage (GBF)", short: "GBF"}
  CORSIA:         {long: "Mandatory airline offsetting (CORSIA-like)", short: "CORSIA-like"}
  VCM_SBTi:       {long: "Voluntary carbon storage (SBTi-aligned)",  short: "SBTi-aligned"}
  VCM_status_quo: {long: "Voluntary offsetting (status quo)",        short: "Status quo"}

# -------------------
# Airfare cost projections (breakeven analysis)
# -------------------
# Which source the 2050 airfare increases come from:
#   cost_paper - the (unpublished) cost paper's "Results 2050 Different rate" tab
#   published  - published cost data in the tidy schema of
#                scripts/preprocessing/airfare_costs_template.csv
cost_source: "cost_paper"
cost_files:
  cost_paper: "raw-data/airfare.csv"
  published:  "raw-data/airfare_costs_published.csv"

# Price range tested in the survey (ticket price increase, %). Predictions
# outside it are extrapolations and are drawn dashed.
tested_cost_range: [10, 50]

# -------------------
# Conjoint attributes
# -------------------
attributes:
  - "fuel_code"
  - "activity_code"
  - "durability_code"
  - "responsibility_code"
  - "cost_code"

# Display names for the conjoint attributes and their levels, used in every
# figure. Attributes and levels are listed in display order (top to bottom);
# each level maps its data code to its display label.
attribute_display:
  fuel_code:
    label: "Fuel"
    levels: {fossil: "Fossil fuels", plants: "Biofuels", electric: "Synthetic fuels"}
  activity_code:
    label: "Offsetting activity"
    levels: {cookstoves: "Traditional offsets", direct_air: "Direct air capture",
             factory_ccs: "Point source capture", trees: "Nature-based offsets"}
  durability_code:
    label: "Durability of offsets"
    levels: {temporary: "Temporary", permanent: "Permanent"}
  responsibility_code:
    label: "Responsible actor"
    levels: {fuel_suppliers: "Fuel suppliers", airline: "Airlines",
             government: "Government", passenger: "Passengers"}
  cost_code:
    label: "Ticket price increase"
    levels: {"10": "+10%", "30": "+30%", "50": "+50%"}

# -------------------
# Plot aesthetics
# -------------------

# All plot colours live here; scripts never hardcode a colour (except white,
# the page background). Hue is reserved for meaning: the two focal policy
# packages, the main-figure highlight and the LPA profiles. Palettes were
# validated for colour-vision deficiency (OKLab dE under protan/deutan
# simulation) against every other colour in the paper.

# Dark ink: single-series plots with no other encoding (supplementary
# attribute plots, LPA diagnostics, interaction plot), and in-plot text
attribute_color: "#333333"
accent_color:    "#333333"

# Indigo highlight for the attribute-level main figures (WTP, country choice).
# Deep enough to stay distinct from the SAF blue and the profile plum (the
# earlier #4a5897 was indistinguishable from the SAF blue, dE 4.7).
highlight_color: "#3f3d99"

# Robustness figures: alternative samples/weights in highlight_color at these
# opacities (full / unweighted sample = 1). Drawn as the equivalent opaque
# tint on white, so CI lines never show through the dots.
robustness_alphas:
  no_speeders:      0.7
  attention_passed: 0.4
  design_weighted:  0.6

# The two focal policy packages (breakeven figure; CVD dE 20.9)
policy_contrast_colors:
  saf: "#4575b4"
  gbf: "#d73027"

# Single colour for policy-level dot plots (policy choice, policy by profile)
policy_color: "#d73027"

# LPA preference profiles: teal / gold / plum. Never shown in the same figure
# as the policy pair (worst CVD dE 10.3, normal dE 17.1).
profile_colors:
  "Profile 1": "#1b9e77"
  "Profile 2": "#b07d1a"
  "Profile 3": "#9b4f96"

# Sequential blues (light -> dark) for climate concern subgroup plots
concern_colors:
  Low:  "#a8c8e8"
  Mid:  "#3a82c4"
  High: "#0d3a6e"

# Second group in two-arm comparisons (net-zero information arm)
secondary_color: "#999999"

# Structural greys and black
reference_line_color: "#999999"   # dashed lines at 0.5 / neutral rating / OR = 1
axis_color:           "#000000"   # axis lines, ticks, table column heads

# Also save the main figures as vector PDF (for journal submission) next to
# the PNG; supplementary figures (output/supp-figs/) are always PNG only.
# Off while drafting; switch on for the final figure set, or for one run with
#   snakemake --cores 1 --config save_pdf=true
save_pdf: false

# Plot dimensions (inches, for ggsave)
# narrow: single-panel plots (general conjoint, NZ framing)
# wide:   6-country facet plots (country conjoint, flyer type etc, framing effect)
# strip:  low-height plots with a few rows (interaction, policy)
plot_size:
  narrow:     {width:  8, height: 9}
  wide:       {width: 11, height: 7}
  strip:      {width: 11, height: 4}
  strip_wide: {width: 13.5, height: 4}
  combined:   {width: 13.5, height: 8}

# Shared geom parameters
point_size:    2.0
errorbar_width: 0
base_font_size: 12
